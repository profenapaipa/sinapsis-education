<!-- Lo lanza herramientas/auditar.py. Por qué existe: los fallos de este tipo de página no se
     ven leyendo el código, se ven midiendo en un navegador. Carga cada pantalla dentro de un
     marco del ancho de un celular o de un escritorio, y mide. Necesita servirse por http (no
     por file://) para poder leer el marco. -->
<body style="margin:0;background:#888">
<iframe id="f" style="border:0;display:block;background:#fff"></iframe>
<pre id="resultado" style="position:fixed;top:0;left:0;max-width:100%;background:#fff;color:#000;font:11px monospace;white-space:pre-wrap"></pre>
<script>
const SECC = { docente: ['resumen', 'estudiantes', 'actividades', 'ajustes', 'notas', 'archivos'], orientacion: ['resumen', 'ajustes', 'estudiantes', 'notas', 'archivos'], familia: ['resumen', 'archivos'], coordinacion: ['resumen', 'estudiantes', 'cursos', 'categorias'], estudiante: ['resumen', 'ruta', 'logros', 'archivos'] };
const RUTAS = [[null, '#/'], [null, '#/mi/resumen'], [null, '#/mapa/conexiones'], [null, '#/mapa/distingue'], [null, '#/valeria/chat'], [null, '#/valeria/conexion'], [null, '#/recorrido/camino'], [null, '#/recorrido/roles'], [null, '#/recorrido/datos'], [null, '#/portales'], [null, '#/portales/kinesis'], [null, '#/portales/wisfox'], [null, '#/portales/valeria'], [null, '#/glosario'], [null, '#/creditos'], [null, '#/planes/formas'], [null, '#/planes/acompanamiento'], [null, '#/registro/lista'], [null, '#/registro/conversar'], [null, '#/guia/docente'], [null, '#/guia/estudiante'], [null, '#/hoja/propuesta'], [null, '#/hoja/arquitectura'], [null, '#/hoja/etapas'], [null, '#/piloto'], [null, '#/identidad'],
  ...Object.entries(SECC).flatMap(([rol, l]) => l.map((x) => [rol, '#/mi/' + x]))];
const ANCHOS = [390, 1280];
const TEMAS = ['claro', 'oscuro'];
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
// ---- ligera ---- Apariencia y modo presentación viven en el menú «Más» (antes, en la franja): este ayudante lo abre antes de tocarlos.
const abrirMas = async (d) => { const m = d.getElementById('menu-mas'); if (m && m.hidden) d.getElementById('btn-mas').click(); await new Promise((r) => setTimeout(r, 120)); };
// ---- fin ligera ----
const f = document.getElementById('f');
const salida = { casos: [], flujo: [], fatal: null };
let n = 0;

function cargar(ruta, ancho, alto) {
  return new Promise((res) => {
    f.style.width = ancho + 'px'; f.style.height = (alto || 900) + 'px';
    f.onload = () => res();
    f.src = '../index.html?t=' + (++n) + '&sin-intro=1' + ruta;   // la bienvenida de la primera vez (js/carrusel.js) se prueba aparte: aquí taparía todas las pantallas
  });
}
const doc = () => f.contentDocument;
const ventana = () => f.contentWindow;

/* ---- contraste ---- */
function parsear(c) {
  let m = c.match(/^rgba?\(([^)]+)\)/);
  if (m) { const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p[3] === undefined ? 1 : p[3]]; }
  m = c.match(/^color\(srgb ([^)]+)\)/);
  if (m) { const p = m[1].split(/[ \/]+/).filter(Boolean).map(Number); return [p[0] * 255, p[1] * 255, p[2] * 255, p[3] === undefined ? 1 : p[3]]; }
  return null;
}
function mezclar(sobre, base) { const a = sobre[3]; return [0, 1, 2].map((i) => sobre[i] * a + base[i] * (1 - a)); }
function fondoEfectivo(el) {
  const capas = [];
  for (let e = el; e; e = e.parentElement) {
    const cs = ventana().getComputedStyle(e);
    if (cs.backgroundImage !== 'none') return null;          // degradado: se omite y se cuenta aparte
    const c = parsear(cs.backgroundColor);
    if (c && c[3] > 0) { capas.push(c); if (c[3] >= 1) break; }
  }
  let base = [255, 255, 255];
  for (let i = capas.length - 1; i >= 0; i--) base = mezclar(capas[i], base);
  return base;
}
const lum = (c) => { const f2 = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f2(c[0]) + 0.7152 * f2(c[1]) + 0.0722 * f2(c[2]); };
const razon = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

function medirContraste() {
  const malos = []; let omitidos = 0; let medidos = 0;
  const d = doc();
  d.querySelectorAll('header *, main *, footer *, .nav-movil *, .guion *').forEach((el) => {
    const tieneTexto = [...el.childNodes].some((x) => x.nodeType === 3 && x.textContent.trim());
    if (!tieneTexto || !el.getClientRects().length) return;
    const cs = ventana().getComputedStyle(el);
    if (cs.visibility === 'hidden' || parseFloat(cs.opacity) < 1) return;
    const fondo = fondoEfectivo(el);
    if (!fondo) { omitidos++; return; }
    let fg = parsear(cs.color); if (!fg) return;
    fg = mezclar(fg, fondo);
    const px = parseFloat(cs.fontSize); const grande = px >= 24 || (px >= 18.66 && parseInt(cs.fontWeight, 10) >= 700);
    const minimo = grande ? 3 : 4.5; const r = razon(fg, fondo); medidos++;
    if (r < minimo) malos.push(`${el.tagName.toLowerCase()}.${(el.className || '').toString().split(' ')[0]} "${el.textContent.trim().slice(0, 28)}" ${r.toFixed(2)}`);
  });
  return { malos: malos.slice(0, 6), total: malos.length, omitidos, medidos };
}

/* ---- una pantalla en un ancho y un tema ---- */
function medirCaso(ruta, ancho, tema, extra) {
  const d = doc(); const w = ventana(); const fallos = [];
  d.documentElement.dataset.tema = tema;
  const e = d.documentElement;
  if (e.scrollWidth > e.clientWidth + 1) fallos.push(`desborda a lo ancho (${e.scrollWidth} > ${e.clientWidth})`);
  // Lo que está dentro de una tira con scroll propio (overflow-x auto) puede salirse a propósito.
  const enScroll = (x) => { for (let p = x.parentElement; p && p !== d.body; p = p.parentElement) { const o = w.getComputedStyle(p).overflowX; if (o === 'auto' || o === 'scroll') return true; } return false; };
  const fuera = [...d.querySelectorAll('main *')].filter((x) => { const r = x.getBoundingClientRect(); return r.width && (r.right > e.clientWidth + 1 || r.left < -1) && !enScroll(x); }).slice(0, 3).map((x) => x.tagName.toLowerCase() + '.' + (x.className || ''));
  if (fuera.length) fallos.push('elementos fuera de pantalla: ' + fuera.join(', '));
  if (w.__errores && w.__errores.length) fallos.push('errores: ' + w.__errores.join(' | '));
  const h1 = d.querySelectorAll('main h1').length + [...d.querySelectorAll('main [role="heading"][aria-level="1"]')].filter((x) => x.getClientRects().length).length;
  if (h1 !== 1) fallos.push(`hay ${h1} títulos h1 (debe haber 1)`);
  ['header', 'main', 'footer'].forEach((t) => { if (!d.querySelector(t)) fallos.push('falta <' + t + '>'); });
  const sinNombre = [...d.querySelectorAll('button, a, input, select, textarea')].filter((x) => x.getClientRects().length && !(x.textContent.trim() || x.getAttribute('aria-label') || (x.labels && x.labels.length) || x.getAttribute('aria-labelledby')));
  if (sinNombre.length) fallos.push(`${sinNombre.length} controles sin nombre accesible`);
  const chicos = [...d.querySelectorAll('button, .btn, input:not([type=hidden]), select, textarea')].filter((x) => { const r = x.getBoundingClientRect(); return r.height > 0 && r.height < 24; });
  if (chicos.length) fallos.push(`${chicos.length} controles de menos de 24 px de alto`);
  // Errores que se ven en pantalla pero no lanzan excepción: un append con una lista, un dato que falta.
  const crudo = d.body.innerText.match(/\[object [A-Za-z]+\]|\bundefined\b|\bNaN\b|\bnull\b/);
  if (crudo) fallos.push('texto roto en pantalla: "' + crudo[0] + '"');
  // Una tarjeta aplastada (un estilo en línea que gana al diseño de celular) no desborda, pero no se puede usar.
  const aplastadas = [...d.querySelectorAll('main .tarjeta, main .chat')].filter((x) => { const r = x.getBoundingClientRect(); return x.getClientRects().length && r.width < 150; });
  if (aplastadas.length) fallos.push(`${aplastadas.length} tarjetas aplastadas (menos de 150 px de ancho)`);
  // La barra de navegación debe verse completa: en celular, todos sus íconos dentro de la pantalla.
  const riel = [...d.querySelectorAll('.riel .riel-item')].filter((x) => { const r = x.getBoundingClientRect(); return r.width && (r.right > e.clientWidth + 1 || r.left < -1); });   // ---- ligera ----
  if (riel.length) fallos.push(`${riel.length} íconos del riel quedan fuera de la pantalla`);
  if (extra) fallos.push(...extra());   // comprobaciones propias de un modo (por ejemplo, el modo presentación)
  const c = medirContraste();
  if (c.total) fallos.push(`${c.total} textos sin contraste suficiente: ` + c.malos.join(' ; '));
  return { ruta, ancho, tema, fallos, contraste: { medidos: c.medidos, omitidos: c.omitidos } };
}

/* ---- el recorrido completo, como lo haría una persona ---- */
const hallar = (txt) => [...doc().querySelectorAll('button, a')].find((x) => x.textContent.trim().startsWith(txt) && x.getClientRects().length);
const textoPagina = () => doc().body.innerText;
function afirmar(nombre, ok, detalle) { salida.flujo.push({ nombre, ok: !!ok, detalle: ok ? '' : (detalle || '') }); }
async function ir(hash) { ventana().location.hash = hash; await espera(250); }
async function pulsar(txt) { const b = hallar(txt); if (!b) { afirmar('existe "' + txt + '"', false, 'no se encontró'); return false; } b.click(); await espera(250); return true; }

const enDialogo = (txt) => [...doc().querySelectorAll('dialog[open] button')].find((x) => x.textContent.trim().startsWith(txt));
const avisos = () => { const a = doc().getElementById('avisos'); return a ? a.innerText : ''; };
const poner = (el, valor) => { el.value = valor; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
const comoRol = async (rol, hash) => { ventana().MT.store.cambiar((s) => { s.rol = rol; }); await ir(hash); ventana().MT.router.recargar(); await espera(150); };
// Un archivo de prueba: PDF con su firma real, para que la validación de contenido lo acepte.
const pdf = (nombre) => new (ventana().File)([new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3])], nombre, { type: 'application/pdf' });
async function subir(archivo, visibilidad) {
  const sel = doc().getElementById('bib-vis'); if (visibilidad) poner(sel, visibilidad);
  const dt = new (ventana().DataTransfer)(); dt.items.add(archivo);
  const inp = doc().getElementById('bib-archivo'); inp.files = dt.files; inp.dispatchEvent(new Event('change', { bubbles: true }));
  await espera(500);
}
const CLINICOS = /TDAH|autismo|dislexia|discapacidad intelectual|d[eé]ficit de atenci[oó]n/i;

const traza = [];
async function flujo() {
  localStorage.clear();
  try { traza.push('paso 1: ' + ventana().MT.db.lista('actividades').length + '/' + (localStorage.getItem('mosaicotelar.v2') || '').length); } catch (e) { /* aún sin app */ }
  // 1. Entrada por rol
  await cargar('#/', 1280); await espera(400);
  afirmar('el inicio pregunta quién eres', textoPagina().includes('¿Quién eres?'));
  // ---- entrada ---- (cambió: las tarjetas de rol ahora son cuatro opciones grandes (.ent-rol) más un enlace discreto para coordinación; siguen siendo los 5 roles)
  afirmar('hay una opción por rol: cuatro grandes y coordinación aparte (5 roles)', doc().querySelectorAll('.ent-rol').length === 4 && [...doc().querySelectorAll('#ent-quien button')].filter((b) => /Soy/.test(b.textContent)).length === 5);
  // ---- fin entrada ----
  // ---- ligera ---- Por qué: la plataforma tenía DOS navegaciones (barra de portales y riel de seis ítems). Ahora es una sola (el riel), que cambia con el rol,
  // y todo lo secundario vive en un único menú «Más». Estas pruebas reemplazan a las del riel de seis ítems y a las de la barra de pestañas.
  const rielTxt = () => [...doc().querySelectorAll('.riel .riel-item')].map((x) => x.textContent.replace(/\s+/g, ' ').trim());
  afirmar('una sola navegación: hay un riel y ninguna barra de portales aparte', doc().querySelectorAll('nav.riel').length === 1 && !doc().getElementById('barra-portales') && !doc().querySelector('.pestanas'));
  // ---- espacio ---- Por qué: decisión del dueño, no hay «Mi espacio»; el riel lleva siempre Kinesis, Wisfox y Guía (más «Más»). Niky es el botón flotante.
  afirmar('sin rol, el riel muestra Kinesis, Wisfox y Guía (y «Más»), sin Mi espacio', rielTxt().join('|') === 'Kinesis|Wisfox|Guía|Más', rielTxt().join('|'));
  // ---- fin espacio ----
  doc().getElementById('btn-mas').click(); await espera(150);
  const enMas = [...doc().querySelectorAll('#menu-mas a')];
  // ---- espacio ---- (los «tres portales» pasaron a la Guía, que está en el riel)
  afirmar('«Más» alcanza todo lo secundario: portales, mapa, roles y datos, participa, hoja de ruta, glosario, piloto, identidad y créditos', ['mapa', 'recorrido', 'planes', 'hoja', 'glosario', 'piloto', 'identidad', 'creditos'].every((id) => enMas.some((x) => x.dataset.ruta === id && x.getClientRects().length)), enMas.map((x) => x.dataset.ruta).join());
  // ---- fin espacio ----
  afirmar('«Más» reúne también lo de uso ocasional: apariencia y modo presentación', !!doc().getElementById('btn-presentacion') && doc().getElementById('btn-presentacion').getClientRects().length > 0 && doc().getElementById('btn-apariencia').getClientRects().length > 0);
  doc().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await espera(100);
  afirmar('Escape cierra «Más» y devuelve el foco a su botón', doc().getElementById('menu-mas').hidden && doc().activeElement === doc().getElementById('btn-mas') && doc().getElementById('btn-mas').getAttribute('aria-expanded') === 'false');
  afirmar('la franja se calmó: un aviso en una línea y un solo botón (el rol)', doc().querySelectorAll('.franja .btn').length === 1 && !!doc().querySelector('.franja .franja-aviso'));
  // ---- niky ---- (cambió: el botón «Niky» del riel se sustituyó por el botón flotante; #btn-ia sigue en el documento, sin mostrarse, para que nada que lo busque se rompa)
  afirmar('Niky tiene un único acceso a la vista, el botón flotante (el del riel se conserva oculto)', doc().querySelectorAll('#btn-ia').length === 1 && !!doc().querySelector('.riel #btn-ia') && doc().querySelector('#btn-ia').getClientRects().length === 0 && doc().querySelectorAll('#niky-fab').length === 1 && doc().getElementById('niky-fab').getClientRects().length > 0);
  // ---- fin niky ----
  // ---- rol ----
  // Por qué: el cambio de rol y el regreso al inicio deben estar siempre a la vista (riel y barra inferior), también en un portal inmersivo.
  afirmar('rol: el riel trae «Inicio» y el selector de rol con la mascota y el nombre del rol', !!doc().querySelector('#riel-inicio[href="#/"]') && !!doc().querySelector('#riel-rol svg.mascota') && doc().getElementById('riel-rol').getAttribute('aria-expanded') === 'false');
  doc().getElementById('riel-rol').click(); await espera(150);
  afirmar('rol: el selector del riel abre los cinco roles, con el foco dentro', !doc().getElementById('menu-rol-riel').hidden && doc().querySelectorAll('#menu-rol-riel button[data-rol]').length === 5 && doc().getElementById('menu-rol-riel').contains(doc().activeElement));
  doc().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await espera(100);
  afirmar('rol: Escape cierra el selector del riel y devuelve el foco a su botón', doc().getElementById('menu-rol-riel').hidden && doc().activeElement === doc().getElementById('riel-rol'));
  for (const [r, p] of [['estudiante', 'wisfox'], ['docente', 'kinesis'], ['orientacion', 'kinesis'], ['familia', 'kinesis'], ['coordinacion', 'kinesis']]) {
    doc().getElementById('riel-rol').click(); await espera(120);
    doc().querySelector('#menu-rol-riel [data-rol="' + r + '"]').click(); await espera(500);
    afirmar(`rol: elegir ${r} en el riel cambia el rol y lleva a ${p}`, ventana().MT.store.obtener().rol === r && ventana().location.hash === '#/portales/' + p, ventana().location.hash);
  }
  doc().getElementById('riel-inicio').click(); await espera(400);
  afirmar('rol: desde un portal, «Inicio» del riel vuelve a la portada sin perder el rol', ventana().location.hash === '#/' && ventana().MT.store.obtener().rol === 'coordinacion');
  // Se deja todo como estaba para las pruebas que siguen: sin rol y en la portada.
  ventana().MT.store.cambiar((s) => { s.rol = null; }); await ventana().MT.vivos.reiniciar(); await ir('#/'); await espera(200);
  // ---- fin rol ----
  // ---- fin ligera ----
  await pulsar('Soy docente');
  // ---- espacio ---- Por qué: «¿Quién eres?» lleva directo al portal del rol, no a una guía ni a Mi espacio (decisión del dueño). La guía se abre aparte.
  afirmar('elegir docente lleva directo al portal de su rol (Kinesis)', ventana().location.hash === '#/portales/kinesis' && ventana().MT.store.obtener().rol === 'docente', ventana().location.hash);
  await ir('#/guia/docente'); ventana().MT.router.recargar();
  // ---- fin espacio ----
  afirmar('la franja dice con qué rol se mira', doc().getElementById('rol-actual').textContent.includes('Docente'));
  afirmar('la guía tiene pasos, cada uno con su portal', doc().querySelectorAll('.guia-paso').length === 5 && /en kinesis/i.test(textoPagina()) && /en niky/i.test(textoPagina()) && /en wisfox/i.test(textoPagina()));
  // ---- ligera ---- (reemplaza las pruebas de la barra de pestañas)
  // ---- espacio ---- Por qué: con rol, el riel sigue trayendo los dos portales y la Guía; el del rol va primero y marcado («tu portal»).
  afirmar('con rol docente el riel muestra Kinesis (tu portal), Wisfox, Guía y Más', rielTxt().join('|') === 'Kinesis (tu portal)|Wisfox|Guía|Más' && !!doc().querySelector('.riel .riel-item--principal[data-portal="kinesis"]'), rielTxt().join('|'));
  // ---- fin espacio ----
  // ---- fin ligera ----
  const abiertas = []; ventana().open = (u) => { abiertas.push(u); return null; };
  await pulsar('Abrir Kinesis'); await espera(600);
  const marcoK = doc().querySelector('.vivos iframe');
  afirmar('Ir a Kinesis lo muestra dentro de la plataforma', ventana().location.hash === '#/portales/kinesis' && !!marcoK && marcoK.getAttribute('src') === ventana().MT.config.portales.kinesis && abiertas.length === 0, ventana().location.hash);
  afirmar('el ítem del portal se marca como actual y el portal queda como abierto', doc().querySelector('.riel [data-portal="kinesis"]').getAttribute('aria-current') === 'page' && doc().querySelector('.riel [data-portal="kinesis"]').classList.contains('riel-item--abierto'));   // ---- ligera: ítem del riel en lugar de pestaña ----
  // Modo inmersivo (cambió): los controles del portal viven en el menú «⋯»; se abre para leerlos.
  { const mb = doc().querySelector('.vivo-menu-btn'); if (mb && !doc().querySelector('.vivos--menu')) { mb.click(); await espera(150); } }
  afirmar('el portal dice qué le toca hacer al rol', /Tu rol: Docente/.test(textoPagina()) && /te toca/.test(textoPagina()));
  const mk = doc().querySelector('.vivos iframe').getBoundingClientRect(); const vent = ventana();
  afirmar('el portal ocupa todo el panel: casi todo el ancho y casi todo el alto de la pantalla', mk.width >= vent.innerWidth * 0.7 && mk.height >= vent.innerHeight * 0.65, Math.round(mk.width) + 'x' + Math.round(mk.height) + ' de ' + vent.innerWidth + 'x' + vent.innerHeight);
  afirmar('modo inmersivo: la barra del portal es un menú flotante que no le resta alto al portal, y no hay franja ni pie', getComputedStyle(doc().querySelector('.vivo-barra')).position === 'absolute' && !visible(doc().querySelector('.franja')) && !visible(doc().querySelector('.pie')));
  afirmar('el portal se puede pasar a pantalla completa', [...doc().querySelectorAll('.vivo-barra button')].some((b) => /Pantalla completa/.test(b.textContent)));
  afirmar('el portal avisa que es una aplicación aparte con sus propios datos', /Aplicación aparte/.test(textoPagina()) && /propios datos/.test(doc().querySelector('.vivo-badge').title));
  // ---- ligera ---- Por qué: las listas desplegables de cada portal desaparecieron con la barra de pestañas (lo que le toca a tu rol ya está en el desplegable del propio portal, «Tu rol: … · qué te toca aquí»).
  // Un portal que no es del rol sigue abriéndose por su dirección, y el riel del docente no tiene ítem de Wisfox.
  await ir('#/portales/wisfox'); await espera(700);
  const marcoW = doc().querySelector('.vivos iframe[src="' + ventana().MT.config.portales.wisfox + '"]');
  afirmar('un portal que no es del rol se abre por su dirección (#/portales/wisfox) dentro de la plataforma', !!marcoW && ventana().location.hash === '#/portales/wisfox' && !!doc().querySelector('.riel'));
  // ---- espacio ---- Por qué: los dos portales están siempre disponibles en el riel.
  afirmar('el riel del docente también trae Wisfox, sin marcar como principal', !!doc().querySelector('.riel [data-portal="wisfox"]') && !doc().querySelector('.riel [data-portal="wisfox"].riel-item--principal'));
  // ---- fin espacio ----
  afirmar('Kinesis y Wisfox quedan abiertos a la vez', ventana().MT.vivos.abiertos().includes('kinesis') && ventana().MT.vivos.abiertos().includes('wisfox'));
  // ---- fin ligera ----
  // Los portales son persistentes: volver a ellos no los recarga, y se ven dos a la vez
  let cargas = 0; marcoK.addEventListener('load', () => cargas++); marcoW.addEventListener('load', () => cargas++);
  doc().querySelector('.riel [data-portal="kinesis"]').click(); await espera(400);   // ---- ligera: ítem del riel ----
  await ir('#/mi/resumen'); await espera(300);
  afirmar('al salir de los portales siguen en el documento, ocultos', marcoK.isConnected && marcoW.isConnected && marcoK.closest('[hidden]'));
  doc().querySelector('.riel [data-portal="kinesis"]').click(); await espera(500);   // ---- ligera: ítem del riel ----
  afirmar('volver a un portal NO lo recarga: conserva lo que se estaba haciendo', cargas === 0 && marcoK.isConnected && !marcoK.closest('[hidden]'), 'cargas=' + cargas);
  poner(doc().getElementById('dividir-con'), 'wisfox'); await espera(300);
  afirmar('la vista dividida muestra dos portales lado a lado', [...doc().querySelectorAll('.vivo-panel')].filter((p) => !p.hidden).length === 2 && doc().querySelector('.vivo-marcos--2') && cargas === 0, 'cargas=' + cargas);

   Demostración en vivo (fase 1): modo presentación, reinicio de un clic, aviso y respaldo sin conexión, versión calmada,

// Las pantallas en modo presentación: tamaños de proyector (1920x1080, 1280x720) y celular, en los dos temas.
const TAMANOS_PRES = [[1920, 1080], [1280, 720], [390, 844]];
const RUTAS_PRES = [[null, '#/'], [null, '#/mi/resumen'], [null, '#/portales'], [null, '#/portales/kinesis'], [null, '#/portales/wisfox'], ['docente', '#/mi/ajustes'], ['estudiante', '#/mi/resumen'], [null, '#/recorrido/camino']];

// Lo que además se mide cuando el modo presentación está activo.
function medirPresentacion(ancho) {
  const d = doc(); const w = ventana(); const e = d.documentElement; const fallos = [];
  if (e.dataset.presentacion !== 'activa') return ['el modo presentación no quedó activo'];
  const g = d.getElementById('guion-mesa');
  if (!g || !g.getClientRects().length) return ['no se ve el guion de la mesa'];
  const r = g.getBoundingClientRect();
  if (r.bottom > w.innerHeight + 1 || r.left < -1 || r.right > e.clientWidth + 1) fallos.push(`el guion se sale de la pantalla (${Math.round(r.left)},${Math.round(r.bottom)} a ${Math.round(r.right)})`);
  if (r.height > w.innerHeight * 0.5) fallos.push(`el guion ocupa más de la mitad de la pantalla (${Math.round(r.height)} de ${w.innerHeight})`);
  const pad = parseFloat(w.getComputedStyle(d.body).paddingBottom);
  if (pad < g.offsetHeight - 1) fallos.push(`el guion tapa el final de la página (relleno ${pad} < ${g.offsetHeight})`);
  const vivos = d.querySelector('.vivos:not([hidden])');
  if (vivos && vivos.getBoundingClientRect().bottom > r.top + 1) fallos.push(`el guion tapa el portal (${Math.round(vivos.getBoundingClientRect().bottom)} > ${Math.round(r.top)})`);
  const letra = parseFloat(w.getComputedStyle(e).fontSize);
  if (ancho >= 1600 && letra < 23.9) fallos.push(`a 1920 px la letra base debe ser de 24 px (es ${letra})`);
  if (ancho >= 1000 && ancho < 1600 && letra < 19.9) fallos.push(`a 1280 px la letra base debe ser de 20 px (es ${letra})`);
  ['.pie'].forEach((s) => { const x = d.querySelector(s); if (x && ancho > 860 && x.getClientRects().length) fallos.push(`${s} debería estar oculto en modo presentación`); });   // ---- ligera: «Más» (en .riel-abajo) debe quedar visible en la mesa: ahí están Apariencia y el modo presentación ----
  // Controles grandes: ningún botón visible de menos de 36 px (los del celular quedan fuera del cálculo de 44 px de la franja).
  const chicos = [...d.querySelectorAll('.btn')].filter((x) => x.getClientRects().length && x.getBoundingClientRect().height < 36);
  if (chicos.length && ancho > 860) fallos.push(`${chicos.length} botones de menos de 36 px en modo presentación`);
  return fallos;
}

async function casosPresentacion() {
  for (const [ancho, alto] of TAMANOS_PRES) for (const [rol, ruta] of RUTAS_PRES) {
    localStorage.clear();
    localStorage.setItem('mosaicotelar.presentacion', JSON.stringify({ activo: true, paso: 3 }));
    if (rol) localStorage.setItem('mosaicotelar.v2', JSON.stringify({ rol }));
    await cargar(ruta, ancho, alto); await espera(800);
    for (const tema of TEMAS) {
      const c = medirCaso('presentación ' + (rol ? rol + ' ' : '') + ruta + ' ' + alto + 'p', ancho, tema, () => medirPresentacion(ancho));
      salida.casos.push(c); await espera(60);
    }
  }
}

  }

  await limpio(1280, 800); R().dataset.movimiento = 'calmado'; await espera(60);

  delete R().dataset.movimiento;
  localStorage.clear();
}
