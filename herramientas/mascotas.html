<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Revisión de las mascotas</title>
<!-- Herramienta de revisión (no forma parte del sitio público): muestra la matriz de las cuatro mascotas por las siete emociones (a 120 y a 56 px), algunas combinaciones con pose y los tamaños 56, 120 y 240,
     en tema claro y en tema oscuro. Se abre servida por http, por ejemplo http://127.0.0.1:8000/herramientas/mascotas.html
     Dirección con opciones: ?tema=claro|oscuro muestra un solo tema; ?viva=1 enciende el parpadeo de reposo; ?calmado=1 pone html[data-movimiento="calmado"]. -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/mascotas.css">
<link rel="stylesheet" href="../css/calmado.css">
<style>
  body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; background: #FFFFFF; color: #1A1714; }
  h1 { font-size: 1.3rem; margin: 0; padding: 1rem 1.25rem .25rem; }
  .nota { margin: 0; padding: 0 1.25rem 1rem; color: #57514A; max-width: 70ch; }
  /* Cada tema se prueba en su propio panel. Se repiten aquí los valores del tema oscuro de tokens.css, hilos incluidos: los hilos hay que
     ponerlos de nuevo porque --hilo-* se resuelve en :root y no cambiaría al cambiar --verde dentro del panel. */
  .tema { padding: 1rem 1.25rem 1.5rem; background: var(--papel); color: var(--tinta); }
  .tema--claro { --tinta: #1A1714; --papel: #FAF7F2; --hilo-kinesis: #1B7F56; --hilo-wisfox: #E8A13C; --hilo-valeria: #2B4FA3; --hilo-mosaico: #E0527E; }
  .tema--oscuro { --tinta: #F4F0E8; --papel: #141210; --hilo-kinesis: #5CC08A; --hilo-wisfox: #E8A13C; --hilo-valeria: #6F8FE8; --hilo-mosaico: #E0527E; }
  .tema h2 { margin: 0 0 .75rem; font-size: 1.05rem; }
  .tema h3 { margin: 1.25rem 0 .5rem; font-size: .9rem; font-weight: 600; opacity: .75; }
  .fila { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .celda { display: flex; flex-direction: column; align-items: center; gap: .25rem; font-size: .75rem; opacity: .9; }
  .celda b { font-weight: 600; }
  .fila--chica { gap: .6rem; }
  .grupo { display: flex; align-items: flex-end; gap: .5rem; padding: .75rem; border: 1px solid color-mix(in srgb, var(--tinta) 18%, transparent); border-radius: 12px; }
</style>
<body>
<h1>Las cuatro mascotas</h1>
<p class="nota">Sinapso (oso de anteojos), Kinesis (pulpo), Wisfox (zorro) y Niky (venado). Mismo contorno, misma cara con siete emociones, mismas proporciones.</p>
<div id="paneles"></div>
<script src="../js/ui.js"></script>
<script src="../js/mascotas.js"></script>
<script>
(function () {
  const MT = window.MT; const q = new URLSearchParams(location.search);
  if (q.get('calmado') === '1') document.documentElement.setAttribute('data-movimiento', 'calmado');
  const viva = q.get('viva') === '1';
  const e = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt) n.textContent = txt; return n; };
  const celda = (id, pose, emocion, tam, rotulo) => {
    const c = e('div', 'celda'); c.append(MT.mascotas.mascota(id, { pose, emocion, tamano: tam, viva }));
    c.append(e('b', '', rotulo)); return c;
  };
  // ?zoom=1: solo las cuatro a 240 px en pose base y tejiendo, para revisar el detalle de cerca (se usa con las capturas de revisión).
  if (q.get('zoom')) {
    const p = e('section', 'tema tema--' + (q.get('tema') || 'claro'));
    for (const pose of (q.get('zoom') === '2' ? ['teje'] : ['base', 'teje'])) {
      const f = e('div', 'fila'); for (const m of MT.mascotas.lista) f.append(celda(m.id, pose, 'contento', 300, m.nombre + ' · ' + pose)); p.append(f);
    }
    document.getElementById('paneles').append(p); return;
  }
  const temas = q.get('tema') ? [q.get('tema')] : ['claro', 'oscuro'];
  for (const tema of temas) {
    const p = e('section', 'tema tema--' + tema); p.id = 'tema-' + tema;
    p.append(e('h2', '', 'Tema ' + tema));
    const secc = (titulo, tam, clase) => {
      p.append(e('h3', '', titulo));
      for (const m of MT.mascotas.lista) {
        const f = e('div', 'fila ' + (clase || ''));
        for (const em of MT.mascotas.EMOCIONES) f.append(celda(m.id, 'base', em, tam, tam > 100 ? m.nombre + ' · ' + em : em));
        p.append(f);
      }
    };
    secc('Matriz: 4 mascotas x 7 emociones a 120 px (pose base)', 120);
    secc('La misma matriz a 56 px, el tamaño del compañero de cada pantalla', 56, 'fila--chica');
    secc('La misma matriz a 240 px, para mirar la textura, la ropa y la lana', 240);
    p.append(e('h3', '', 'Cada pose (contento): saluda, señala, piensa, celebra y teje'));
    for (const m of MT.mascotas.lista) {
      const f = e('div', 'fila');
      for (const po of MT.mascotas.POSES) f.append(celda(m.id, po, undefined, 120, m.nombre + ' · ' + po));
      p.append(f);
    }
    // El ciclo de tejer en cuadros: se congela la animación en cada instante con un retraso negativo y en pausa.
    p.append(e('h3', '', 'El ciclo de tejer, en cuadros (0, 0,6, 1,2, 1,8, 2,4 y 3,1 s) a 120 px'));
    for (const m of MT.mascotas.lista) {
      const f = e('div', 'fila');
      for (const t of [0, 0.6, 1.2, 1.8, 2.4, 3.1]) {
        const c = e('div', 'celda'); const sv = MT.mascotas.mascota(m.id, { pose: 'teje', tamano: 120 });
        sv.classList.add('mascota--tejiendo');
        for (const n of sv.querySelectorAll('.m-ag-i, .m-ag-d, .m-flujo, .m-ovillo, .m-fila-nueva')) { n.style.animationDelay = '-' + t + 's'; n.style.animationPlayState = 'paused'; }
        c.append(sv, e('b', '', m.nombre + ' · ' + t + ' s')); f.append(c);
      }
      p.append(f);
    }
    p.append(e('h3', '', 'En fila, como las verá quien entra (escena); la de abajo teje de verdad (cada 12 a 20 s)'));
    p.append(MT.mascotas.escena(null, { tamano: 110, pose: 'saluda' }));
    p.append(MT.mascotas.escena(null, { tamano: 110, teje: true }));
    document.getElementById('paneles').append(p);
  }
})();
</script>
