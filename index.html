<!-- Una sola navegación: el riel (a la izquierda en pantallas grandes, abajo en el celular). Lo arma js/barra.js según el rol:
     sin rol, lo mínimo (inicio y elegir rol); con rol, solo lo suyo (su portal y Mi espacio). Niky y «Más» van siempre. -->
<nav class="riel" id="riel" aria-label="Principal">
  <a class="riel-logo" href="#/" data-ruta="inicio" aria-label="Sinapsis Education, inicio" id="riel-logo"></a>
  <div class="riel-items" id="riel-items"></div>
  <div class="riel-abajo" id="riel-abajo"></div>
</nav>

<div class="cuerpo">
  <header class="franja">
    <a class="franja-logo" id="franja-logo" href="#/" aria-label="Sinapsis Education, inicio"></a>
    <p class="franja-aviso">Demostración con datos de ejemplo: lo que creas en Sinapsis se guarda solo en este dispositivo.</p>
    <!-- quien2: acceso al tutorial guiado siempre visible, en todas las pantallas (pedido del dueño) -->
    <a class="franja-tutorial" href="#/tutorial">Tutorial guiado</a>
    <div class="franja-rol">
      <button class="btn btn--chico btn--suave rol-actual" id="rol-actual" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-rol">Elegir mi rol</button>
      <div class="menu-rol" id="menu-rol" hidden></div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><div class="contenedor"><p class="aviso">Esta plataforma necesita JavaScript para funcionar. No envía datos a ningún sitio.</p></div></noscript>
  </main>

  <footer class="pie">
    <span id="logo-pie"></span>
    <div>
      <p><strong>Sinapsis Education</strong> · Tejemos caminos para aprender.</p>
      <p>Semillero Maker de Tecnología con Sentido.</p>
      <p><a href="#/contacto">Contacto</a></p>
    </div>
  </footer>
</div>

<!-- El único menú «Más»: las páginas secundarias (las rutas siguen siendo las mismas) y lo de uso ocasional (participar, modo presentación,
     apariencia). Las páginas las pinta js/barra.js; lo demás está aquí para que js/presentacion.js encuentre su sitio al cargar. -->
<div class="menu-mas" id="menu-mas" hidden role="group" aria-label="Más">
  <ul class="menu-mas__paginas" id="mas-paginas"></ul>
  <div class="menu-mas__herramientas franja-acciones" id="mas-herramientas">
    <button class="btn btn--chico btn--suave" id="btn-apariencia" type="button" aria-expanded="false" aria-controls="menu-apariencia">Apariencia</button>
    <div class="menu-apariencia" id="menu-apariencia" hidden></div>
  </div>
</div>
